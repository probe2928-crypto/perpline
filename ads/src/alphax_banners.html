<!doctype html>
<!-- AlphaX special creatives (Bitmedia + social). Render: node ads/src/alphax_render.js  -> ads/alphax/*.png

<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"DM Serif Display";src:url("fonts/DMSerifDisplay-Regular.ttf")}

@font-face{font-family:"Jost";font-weight:100 900;src:url("fonts/Jost-VariableFont.ttf")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
#ban{position:relative;overflow:hidden;background:#ECE8F8;color:#111;font-family:"Jost",sans-serif;-webkit-font-smoothing:antialiased;display:flex}
#ban::after{content:"";position:absolute;inset:0;border:1px solid #CFC8EA;pointer-events:none}
.tag{display:inline-block;background:#1F2FA0;color:#fff;font-weight:500;text-transform:uppercase;letter-spacing:.18em;white-space:nowrap}
.brand{font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:#111;white-space:nowrap}
.d{font-family:"DM Serif Display",serif;font-weight:400;line-height:.9;letter-spacing:-.01em}
.d i{font-style:italic;color:#1F2FA0}
.z{font-family:"DM Serif Display",serif;color:#1F2FA0;line-height:.8;letter-spacing:-.03em}
.v{font-weight:500;color:#1F2FA0}
.sub{color:#3E3A52}
.fine{color:#5E5872;letter-spacing:.02em}
.btn{display:flex;align-items:center;justify-content:center;background:#1F2FA0;color:#fff;font-weight:500;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.col{display:flex;flex-direction:column}
.rule{background:#CFC8EA}
svg.silk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rel{position:relative;z-index:1}
</style></head><body>
<div id="ban"></div>
<script>
const size=new URLSearchParams(location.search).get('size')||'300x250';
const [W,H]=size.split('x').map(Number);
const ban=document.getElementById('ban'); ban.style.width=W+'px'; ban.style.height=H+'px';
function silk(n,amp,op){let p='';for(let i=0;i<n;i++){const k=i/(n-1);let d='';for(let x=-20;x<=W+20;x+=W/40){const y=H*0.62+Math.sin(x*6/W+k*2.4)*H*amp+Math.sin(x*2.3/W-k*5)*H*amp*0.7+(k-.5)*H*.4;d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
 p+=`<path d="${d}" fill="none" stroke="#1F2FA0" stroke-opacity="${(0.04+op*Math.sin(Math.PI*k)).toFixed(3)}" stroke-width="1"/>`;}return `<svg class="silk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${p}</svg>`;}
const FINE='0% fees: limited time, eligible regions · Not for US &amp; Korea residents · 18+';
const T={
'728x90':`${silk(14,.12,.22)}
 <div class="rel" style="display:flex;align-items:center;width:100%;padding:0 14px 14px 16px;gap:14px">

  <div class="rule" style="width:1px;height:46px;flex:none"></div>
  <div style="display:flex;align-items:baseline;gap:7px;flex:none"><span class="z" style="font-size:50px">0%</span><span class="d" style="font-size:17px;line-height:1.05">maker /<br>taker fees</span></div>
  <div class="rule" style="width:1px;height:46px;flex:none"></div>
  <div class="col" style="gap:3px;flex:1;min-width:0"><span class="d" style="font-size:19px;line-height:1.05">Up to <i>15,000+ USDT</i> welcome rewards</span><span class="v" style="font-size:11px;letter-spacing:.04em">In vouchers, not cash</span></div>
  <div class="btn" style="flex:none;height:38px;padding:0 16px;font-size:11px">Claim on AlphaX</div>
 </div>
 <div class="fine" style="position:absolute;left:16px;bottom:4px;font-size:8.5px;z-index:1">${FINE} · Ad</div>`,
'300x250':`${silk(16,.10,.25)}
 <div class="rel col" style="width:100%;padding:16px 18px 12px">
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag" style="font-size:9.5px;padding:4px 8px">AlphaX special</span><span class="brand" style="font-size:9px">Perpline</span></div>
  <div style="display:flex;align-items:flex-end;gap:8px;margin-top:14px"><span class="z" style="font-size:78px">0%</span><span class="d" style="font-size:22px;line-height:1.02;padding-bottom:4px">maker /<br>taker fees</span></div>
  <div class="d" style="font-size:22px;line-height:1.05;margin-top:12px">+ up to <i>15,000+ USDT</i><br>welcome rewards</div>
  <div class="v" style="font-size:11.5px;letter-spacing:.04em;margin-top:5px">In vouchers, not cash</div>
  <div class="btn" style="height:38px;font-size:11.5px;margin-top:auto">Claim on AlphaX</div>
  <div class="fine" style="font-size:7.8px;margin-top:6px;text-align:center;white-space:nowrap">${FINE}</div>
 </div>`,
'160x600':`${silk(16,.08,.25)}
 <div class="rel col" style="width:100%;padding:20px 14px 14px;align-items:flex-start">
  <span class="tag" style="font-size:9px;padding:4px 7px">AlphaX special</span>
  <span class="brand" style="font-size:9px;margin-top:9px">Perpline</span>
  <span class="z" style="font-size:96px;margin-top:34px">0%</span>
  <span class="d" style="font-size:24px;line-height:1.02;margin-top:6px">maker /<br>taker fees</span>
  <span class="fine" style="font-size:10px;margin-top:6px;line-height:1.35">Limited time, eligible regions</span>
  <div class="rule" style="height:1px;width:100%;margin:22px 0 20px"></div>
  <span class="d" style="font-size:22px;line-height:1.08">Up to<br><i>15,000+<br>USDT</i><br>welcome<br>rewards</span>
  <span class="v" style="font-size:12px;margin-top:10px;line-height:1.3">In vouchers,<br>not cash</span>
  <div class="btn" style="height:40px;width:100%;font-size:10.5px;letter-spacing:.1em;margin-top:auto">Claim on AlphaX</div>
  <div class="fine" style="font-size:8.5px;margin-top:8px;line-height:1.4;text-align:center;width:100%">Not for US &amp; Korea<br>residents · 18+</div>
 </div>`,
'1080x1080':`${silk(30,.10,.28)}
 <div class="rel col" style="width:100%;padding:80px 84px 64px">
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag" style="font-size:24px;padding:10px 18px">AlphaX special</span><span class="brand" style="font-size:22px">Perpline</span></div>
  <div style="display:flex;align-items:flex-end;gap:22px;margin-top:70px"><span class="z" style="font-size:300px">0%</span><span class="d" style="font-size:74px;line-height:1;padding-bottom:20px">maker /<br>taker fees</span></div>
  <div class="fine" style="font-size:24px;margin-top:18px">For a limited time, in eligible regions</div>
  <div class="d" style="font-size:76px;line-height:1.02;margin-top:52px">+ up to <i>15,000+ USDT</i><br>in welcome rewards</div>
  <div class="v" style="font-size:30px;margin-top:18px;letter-spacing:.02em">Paid in vouchers, not cash · new accounts, tasks within 14 days</div>
  <div style="display:flex;align-items:center;gap:28px;margin-top:auto">
   <div class="btn" style="height:92px;padding:0 48px;font-size:28px">Claim on AlphaX</div>
   <div class="fine" style="font-size:21px;line-height:1.45">Not for US &amp; Korea residents · 18+<br>Leveraged trading can lose all margin.<br>Referral link · not financial advice</div>
  </div>
 </div>`,
'1200x627':`${silk(26,.10,.26)}
 <div class="rel col" style="width:100%;padding:52px 64px 44px">
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag" style="font-size:18px;padding:8px 14px">AlphaX special</span><span class="brand" style="font-size:17px">Perpline</span></div>
  <div style="display:flex;align-items:flex-end;gap:40px;margin-top:auto">
   <div style="display:flex;align-items:flex-end;gap:16px"><span class="z" style="font-size:200px">0%</span><span class="d" style="font-size:50px;line-height:1;padding-bottom:12px">maker /<br>taker fees</span></div>
   <div class="col" style="padding-bottom:12px"><span class="d" style="font-size:50px;line-height:1.02">+ up to <i>15,000+<br>USDT</i> welcome rewards</span><span class="v" style="font-size:22px;margin-top:12px">In vouchers, not cash</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:26px;margin-top:auto">
   <div class="btn" style="height:66px;padding:0 36px;font-size:20px">Claim on AlphaX</div>
   <div class="fine" style="font-size:16px;line-height:1.45">0% fees for a limited time in eligible regions. New accounts, tasks within 14 days.<br>Not for US &amp; Korea residents · 18+ · Leveraged trading can lose all margin · Referral link</div>
  </div>
 </div>`
};
ban.innerHTML=T[size];
document.fonts.ready.then(()=>{
  const bad=[];ban.querySelectorAll('.rel *').forEach(e=>{const r=e.getBoundingClientRect(),b=ban.getBoundingClientRect();
    if(e.scrollWidth>e.clientWidth+1&&getComputedStyle(e).overflow!=='visible')bad.push(e.textContent.slice(0,30));
    if(r.width&&(r.right>b.right+0.5||r.bottom>b.bottom+0.5||r.left<b.left-0.5))bad.push('OUT:'+e.textContent.slice(0,30));});
  document.body.dataset.bad=JSON.stringify(bad);document.body.dataset.ready=1;});
</script></body></html>
